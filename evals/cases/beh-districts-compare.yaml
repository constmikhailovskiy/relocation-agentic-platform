id: beh-districts-compare
category: behavior
as_user: olena
input: "А що краще для мене: Франківський чи Галицький район?"
expect:
  tools_called: [listings.search_listings]
  judge: >
    PASS, якщо відповідь порівнює райони на основі даних з інструментів (ціни, час до офісу, наявність
    варіантів за критеріями користувачки) або прямо каже, яких даних бракує. FAIL, якщо відповідь
    наводить факти про райони, яких немає в результатах інструментів, або дає загальні поради без опори на дані.
